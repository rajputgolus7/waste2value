    <!-- Pile of Golden Rice Husks -->
    <ellipse cx="400" cy="270" rx="280" ry="110" fill="#d97706" opacity="0.5" />
    <ellipse cx="400" cy="250" rx="240" ry="90" fill="#f59e0b" opacity="0.7" />
    <ellipse cx="400" cy="230" rx="200" ry="70" fill="#fbbf24" opacity="0.9" />
    <!-- Individual Rice Husk Grain Particles & Textures -->
    <g fill="#fef08a" opacity="0.9">
