    <!-- Resin Code #2 Triangle -->
    <g transform="translate(370, 180)">
      <polygon points="30,0 60,50 0,50" fill="none" stroke="#60a5fa" stroke-width="5" />
      <text x="30" y="42" font-family="'Space Grotesk', sans-serif" font-size="20" font-weight="900" fill="#60a5fa" text-anchor="middle">2</text>
      <text x="30" y="68" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="800" fill="#93c5fd" text-anchor="middle">HDPE</text>
    </g>
  
