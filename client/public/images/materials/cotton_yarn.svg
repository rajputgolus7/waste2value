<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#0f172a" />
      <stop offset="50%" stopColor="#1e293b" />
      <stop offset="100%" stopColor="#090d16" />
    </linearGradient>
    <linearGradient id="gradMetallic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#f1f5f9" />
      <stop offset="50%" stopColor="#94a3b8" />
      <stop offset="100%" stopColor="#475569" />
    </linearGradient>
    <linearGradient id="gradGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#fef08a" />
      <stop offset="50%" stopColor="#ca8a04" />
      <stop offset="100%" stopColor="#854d0e" />
    </linearGradient>
    <linearGradient id="gradAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#fde68a" />
      <stop offset="50%" stopColor="#d97706" />
      <stop offset="100%" stopColor="#78350f" />
    </linearGradient>
    <linearGradient id="gradBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#60a5fa" />
      <stop offset="50%" stopColor="#2563eb" />
      <stop offset="100%" stopColor="#1e3a8a" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.35" />
    </filter>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="500" fill="url(#bg)" />

  <!-- Industrial Mesh / Grid Pattern -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="160" y1="0" x2="160" y2="500" />
    <line x1="320" y1="0" x2="320" y2="500" />
    <line x1="480" y1="0" x2="480" y2="500" />
    <line x1="640" y1="0" x2="640" y2="500" />
  </g>

  <!-- Material Illustration Artwork -->
  <g filter="url(#shadow)">
    
    <!-- Textile Yarn Cones / Bobbins Spools -->
    <!-- Spool 1 (Left) -->
    <path d="M 220 280 L 250 160 L 290 160 L 320 280 Z" fill="#f8fafc" />
    <ellipse cx="270" cy="160" rx="20" ry="6" fill="#cbd5e1" />
    <ellipse cx="270" cy="280" rx="50" ry="14" fill="#94a3b8" />
    <line x1="270" y1="130" x2="270" y2="160" stroke="#f59e0b" stroke-width="8" stroke-linecap="round" />

    <!-- Spool 2 (Center - Main) -->
    <path d="M 350 290 L 385 140 L 435 140 L 470 290 Z" fill="#ffffff" />
    <ellipse cx="410" cy="140" rx="25" ry="8" fill="#e2e8f0" />
    <ellipse cx="410" cy="290" rx="60" ry="16" fill="#cbd5e1" />
    <line x1="410" y1="110" x2="410" y2="140" stroke="#ef4444" stroke-width="10" stroke-linecap="round" />
    <!-- Fine Thread Windings Pattern -->
    <g stroke="#94a3b8" stroke-width="1.5" opacity="0.4">
      <ellipse cx="410" cy="160" rx="30" ry="7" fill="none" />
<ellipse cx="410" cy="168" rx="32" ry="7" fill="none" />
<ellipse cx="410" cy="176" rx="34" ry="7" fill="none" />
<ellipse cx="410" cy="184" rx="36" ry="7" fill="none" />
<ellipse cx="410" cy="192" rx="38" ry="7" fill="none" />
<ellipse cx="410" cy="200" rx="40" ry="7" fill="none" />
<ellipse cx="410" cy="208" rx="42" ry="7" fill="none" />
<ellipse cx="410" cy="216" rx="44" ry="7" fill="none" />
<ellipse cx="410" cy="224" rx="46" ry="7" fill="none" />
<ellipse cx="410" cy="232" rx="48" ry="7" fill="none" />
<ellipse cx="410" cy="240" rx="50" ry="7" fill="none" />
<ellipse cx="410" cy="248" rx="52" ry="7" fill="none" />
<ellipse cx="410" cy="256" rx="54" ry="7" fill="none" />
<ellipse cx="410" cy="264" rx="56" ry="7" fill="none" />
<ellipse cx="410" cy="272" rx="58" ry="7" fill="none" />
    </g>

    <!-- Spool 3 (Right) -->
    <path d="M 500 280 L 530 160 L 570 160 L 600 280 Z" fill="#f8fafc" />
    <ellipse cx="550" cy="160" rx="20" ry="6" fill="#cbd5e1" />
    <ellipse cx="550" cy="280" rx="50" ry="14" fill="#94a3b8" />
    <line x1="550" y1="130" x2="550" y2="160" stroke="#3b82f6" stroke-width="8" stroke-linecap="round" />

    <!-- Loose Cotton Fibers at Base -->
    <ellipse cx="400" cy="300" rx="240" ry="25" fill="#ffffff" opacity="0.85" />
    <ellipse cx="400" cy="295" rx="200" ry="20" fill="#f1f5f9" opacity="0.9" />
  
  </g>

  <!-- Top Dark Gradient Overlay for Badges -->
  <rect width="800" height="120" fill="url(#bg)" opacity="0.65" />
  <rect width="800" height="500" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.1" />

  <!-- Material Category Badge -->
  <g transform="translate(40, 36)">
    <rect width="210" height="34" rx="17" fill="#0f172a" opacity="0.85" />
    <circle cx="17" cy="17" r="6" fill="#38bdf8" />
    <text x="32" y="22" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="800" fill="#ffffff" letter-spacing="1.2">
      TEXTILE FIBERS & GARMENT WASTE
    </text>
  </g>

  <!-- Bottom Material Title Plate -->
  <g transform="translate(0, 380)">
    <rect width="800" height="120" fill="#090d16" opacity="0.9" />
    <line x1="0" y1="0" x2="800" y2="0" stroke="#38bdf8" stroke-width="3" opacity="0.8" />
    <text x="40" y="44" font-family="'Space Grotesk', system-ui, sans-serif" font-size="22" font-weight="700" fill="#ffffff" letter-spacing="0.5">
      100% Cotton Yarn Comber Noils & Ring Waste
    </text>
    <text x="40" y="76" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="500" fill="#94a3b8">
      Virgin combed ring-spun fibers • Staple 18-22mm • Grade A clean white
    </text>
    <!-- Verified Material Spec Stamp -->
    <g transform="translate(620, 24)">
      <rect width="140" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
      <text x="70" y="23" font-family="'Space Grotesk', system-ui, sans-serif" font-size="11" font-weight="700" fill="#38bdf8" text-anchor="middle" letter-spacing="1">
        VERIFIED FEEDSTOCK
      </text>
    </g>
  </g>
</svg>