<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#221e10" />
      <stop offset="50%" stopColor="#3f371a" />
      <stop offset="100%" stopColor="#1a170c" />
    </linearGradient>
    <linearGradient id="gradMetallic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#f1f5f9" />
      <stop offset="50%" stopColor="#94a3b8" />
      <stop offset="100%" stopColor="#475569" />
    </linearGradient>
    <linearGradient id="gradGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#fef08a" />
      <stop offset="50%" stopColor="#ca8a04" />
      <stop offset="100%" stopColor="#854d0e" />
    </linearGradient>
    <linearGradient id="gradAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#fde68a" />
      <stop offset="50%" stopColor="#d97706" />
      <stop offset="100%" stopColor="#78350f" />
    </linearGradient>
    <linearGradient id="gradBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#60a5fa" />
      <stop offset="50%" stopColor="#2563eb" />
      <stop offset="100%" stopColor="#1e3a8a" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.35" />
    </filter>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="500" fill="url(#bg)" />

  <!-- Industrial Mesh / Grid Pattern -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="160" y1="0" x2="160" y2="500" />
    <line x1="320" y1="0" x2="320" y2="500" />
    <line x1="480" y1="0" x2="480" y2="500" />
    <line x1="640" y1="0" x2="640" y2="500" />
  </g>

  <!-- Material Illustration Artwork -->
  <g filter="url(#shadow)">
    
    <!-- Bagasse Compressed Bale Structure -->
    <rect x="220" y="140" width="360" height="190" rx="16" fill="#854d0e" />
    <rect x="235" y="152" width="330" height="166" rx="12" fill="#a16207" />
    <!-- Fibrous Striations & Shredded Sugarcane Canes -->
    <g stroke="#fef08a" stroke-width="2.5" opacity="0.75" stroke-linecap="round">
      <line x1="245" y1="160" x2="550" y2="159" />
<line x1="249" y1="165" x2="547" y2="165" />
<line x1="253" y1="170" x2="544" y2="171" />
<line x1="257" y1="175" x2="541" y2="174" />
<line x1="261" y1="180" x2="550" y2="180" />
<line x1="265" y1="185" x2="547" y2="186" />
<line x1="269" y1="190" x2="544" y2="189" />
<line x1="245" y1="195" x2="541" y2="195" />
<line x1="249" y1="200" x2="550" y2="201" />
<line x1="253" y1="205" x2="547" y2="204" />
<line x1="257" y1="210" x2="544" y2="210" />
<line x1="261" y1="215" x2="541" y2="216" />
<line x1="265" y1="220" x2="550" y2="219" />
<line x1="269" y1="225" x2="547" y2="225" />
<line x1="245" y1="230" x2="544" y2="231" />
<line x1="249" y1="235" x2="541" y2="234" />
<line x1="253" y1="240" x2="550" y2="240" />
<line x1="257" y1="245" x2="547" y2="246" />
<line x1="261" y1="250" x2="544" y2="249" />
<line x1="265" y1="255" x2="541" y2="255" />
<line x1="269" y1="260" x2="550" y2="261" />
<line x1="245" y1="265" x2="547" y2="264" />
<line x1="249" y1="270" x2="544" y2="270" />
<line x1="253" y1="275" x2="541" y2="276" />
<line x1="257" y1="280" x2="550" y2="279" />
<line x1="261" y1="285" x2="547" y2="285" />
<line x1="265" y1="290" x2="544" y2="291" />
<line x1="269" y1="295" x2="541" y2="294" />
<line x1="245" y1="300" x2="550" y2="300" />
<line x1="249" y1="305" x2="547" y2="306" />
    </g>
    <!-- Bale High-Tensile Banding Straps -->
    <rect x="290" y="140" width="12" height="190" fill="#1e293b" />
    <rect x="395" y="140" width="12" height="190" fill="#1e293b" />
    <rect x="500" y="140" width="12" height="190" fill="#1e293b" />
  
  </g>

  <!-- Top Dark Gradient Overlay for Badges -->
  <rect width="800" height="120" fill="url(#bg)" opacity="0.65" />
  <rect width="800" height="500" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.1" />

  <!-- Material Category Badge -->
  <g transform="translate(40, 36)">
    <rect width="210" height="34" rx="17" fill="#0f172a" opacity="0.85" />
    <circle cx="17" cy="17" r="6" fill="#ca8a04" />
    <text x="32" y="22" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="800" fill="#ffffff" letter-spacing="1.2">
      BIOMASS & AGRO FEEDSTOCK
    </text>
  </g>

  <!-- Bottom Material Title Plate -->
  <g transform="translate(0, 380)">
    <rect width="800" height="120" fill="#090d16" opacity="0.9" />
    <line x1="0" y1="0" x2="800" y2="0" stroke="#ca8a04" stroke-width="3" opacity="0.8" />
    <text x="40" y="44" font-family="'Space Grotesk', system-ui, sans-serif" font-size="22" font-weight="700" fill="#ffffff" letter-spacing="0.5">
      Sugarcane Bagasse (Depithed Agro Fibers)
    </text>
    <text x="40" y="76" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="500" fill="#94a3b8">
      Crushed fibrous stalks • Baled solar-dried • High cellulose boiler fuel
    </text>
    <!-- Verified Material Spec Stamp -->
    <g transform="translate(620, 24)">
      <rect width="140" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
      <text x="70" y="23" font-family="'Space Grotesk', system-ui, sans-serif" font-size="11" font-weight="700" fill="#38bdf8" text-anchor="middle" letter-spacing="1">
        VERIFIED FEEDSTOCK
      </text>
    </g>
  </g>
</svg>