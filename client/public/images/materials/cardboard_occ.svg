<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#3b250c" />
      <stop offset="50%" stopColor="#543615" />
      <stop offset="100%" stopColor="#241606" />
    </linearGradient>
    <linearGradient id="gradMetallic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#f1f5f9" />
      <stop offset="50%" stopColor="#94a3b8" />
      <stop offset="100%" stopColor="#475569" />
    </linearGradient>
    <linearGradient id="gradGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#fef08a" />
      <stop offset="50%" stopColor="#ca8a04" />
      <stop offset="100%" stopColor="#854d0e" />
    </linearGradient>
    <linearGradient id="gradAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#fde68a" />
      <stop offset="50%" stopColor="#d97706" />
      <stop offset="100%" stopColor="#78350f" />
    </linearGradient>
    <linearGradient id="gradBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#60a5fa" />
      <stop offset="50%" stopColor="#2563eb" />
      <stop offset="100%" stopColor="#1e3a8a" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.35" />
    </filter>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="500" fill="url(#bg)" />

  <!-- Industrial Mesh / Grid Pattern -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="160" y1="0" x2="160" y2="500" />
    <line x1="320" y1="0" x2="320" y2="500" />
    <line x1="480" y1="0" x2="480" y2="500" />
    <line x1="640" y1="0" x2="640" y2="500" />
  </g>

  <!-- Material Illustration Artwork -->
  <g filter="url(#shadow)">
    
    <!-- Compressed Stacked Cardboard Bales -->
    <g fill="#92400e" stroke="#b45309" stroke-width="2">
      <rect x="220" y="140" width="360" height="180" rx="8" />
      <!-- Fluted Edge Corrugation Pattern -->
      <path d="M 220 180 Q 230 170 240 180 T 260 180 T 280 180 T 300 180 T 320 180 T 340 180 T 360 180 T 380 180 T 400 180 T 420 180 T 440 180 T 460 180 T 480 180 T 500 180 T 520 180 T 540 180 T 560 180 T 580 180" stroke="#fde68a" stroke-width="2.5" fill="none" />
      <path d="M 220 230 Q 230 220 240 230 T 260 230 T 280 230 T 300 230 T 320 230 T 340 230 T 360 230 T 380 230 T 400 230 T 420 230 T 440 230 T 460 230 T 480 230 T 500 230 T 520 230 T 540 230 T 560 230 T 580 230" stroke="#fde68a" stroke-width="2.5" fill="none" />
      <path d="M 220 280 Q 230 270 240 280 T 260 280 T 280 280 T 300 280 T 320 280 T 340 280 T 360 280 T 380 280 T 400 280 T 420 280 T 440 280 T 460 280 T 480 280 T 500 280 T 520 280 T 540 280 T 560 280 T 580 280" stroke="#fde68a" stroke-width="2.5" fill="none" />
    </g>
    <!-- Steel Strapping Bands -->
    <rect x="310" y="140" width="10" height="180" fill="#1e293b" />
    <rect x="480" y="140" width="10" height="180" fill="#1e293b" />
  
  </g>

  <!-- Top Dark Gradient Overlay for Badges -->
  <rect width="800" height="120" fill="url(#bg)" opacity="0.65" />
  <rect width="800" height="500" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.1" />

  <!-- Material Category Badge -->
  <g transform="translate(40, 36)">
    <rect width="210" height="34" rx="17" fill="#0f172a" opacity="0.85" />
    <circle cx="17" cy="17" r="6" fill="#d97706" />
    <text x="32" y="22" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="800" fill="#ffffff" letter-spacing="1.2">
      PAPER, PULP & PACKAGING
    </text>
  </g>

  <!-- Bottom Material Title Plate -->
  <g transform="translate(0, 380)">
    <rect width="800" height="120" fill="#090d16" opacity="0.9" />
    <line x1="0" y1="0" x2="800" y2="0" stroke="#d97706" stroke-width="3" opacity="0.8" />
    <text x="40" y="44" font-family="'Space Grotesk', system-ui, sans-serif" font-size="22" font-weight="700" fill="#ffffff" letter-spacing="0.5">
      Corrugated Cardboard Offcuts (OCC 95/5 Baled)
    </text>
    <text x="40" y="76" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="500" fill="#94a3b8">
      Double-wall cartons • Clean baled die-cut sheets • Certified moisture <10%
    </text>
    <!-- Verified Material Spec Stamp -->
    <g transform="translate(620, 24)">
      <rect width="140" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
      <text x="70" y="23" font-family="'Space Grotesk', system-ui, sans-serif" font-size="11" font-weight="700" fill="#38bdf8" text-anchor="middle" letter-spacing="1">
        VERIFIED FEEDSTOCK
      </text>
    </g>
  </g>
</svg>