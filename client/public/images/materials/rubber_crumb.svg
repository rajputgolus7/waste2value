  <!-- Bottom Material Title Plate -->
  <g transform="translate(0, 380)">
    <rect width="800" height="120" fill="#090d16" opacity="0.9" />
    <line x1="0" y1="0" x2="800" y2="0" stroke="#71717a" stroke-width="3" opacity="0.8" />
    <text x="40" y="44" font-family="'Space Grotesk', system-ui, sans-serif" font-size="22" font-weight="700" fill="#ffffff" letter-spacing="0.5">
